<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Анализ медицинских изображений</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/frontend/script.js" defer></script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

<h1 class="text-2xl font-bold mb-6">Анализ медицинских изображений</h1>

<div id="drop-area" class="w-full max-w-xl bg-white border-4 border-dashed border-gray-300 rounded-lg p-6 text-center cursor-pointer">
    <p class="text-lg text-gray-600">Перетащите сюда изображения или нажмите для выбора (максимум 3)</p>
    <input id="fileElem" type="file" accept="image/*" multiple hidden>
</div>

<div id="preview-container" class="mt-4 flex gap-4 flex-wrap justify-center"></div>

<div class="mt-4 flex gap-4">
    <button id="process-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded hidden">Обработать</button>
    <button id="delete-btn" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded hidden">Удалить</button>
</div>

<div id="result-block" class="hidden mt-6 bg-white p-4 rounded shadow-md w-full max-w-xl">
    <h2 class="text-lg font-bold mb-2">Результат анализа:</h2>
    <p id="result-text" class="text-gray-700"></p>
</div>

<div id="loading-spinner" class="hidden mt-6">
    <div class="animate-spin rounded-full h-10 w-10 border-t-4 border-blue-500 border-solid mx-auto"></div>
    <p class="text-center text-gray-600 mt-2">Анализируется...</p>
</div>

<a id="retrain-link" href="retrain.html" class="mt-4 text-blue-500 hover:underline">Дообучить модель</a>

</body>
</html>
